<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 560px;
      padding: 32px;
      height: fit-content;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 4px;
    }

    #counter {
      font-size: 0.875rem;
      color: #718096;
      margin-bottom: 24px;
    }

    /* ── Error banner ─────────────────────────────────────────────────────── */
    #error-banner {
      display: none;
      background: #fed7d7;
      color: #c53030;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
    }

    /* ── Add form ─────────────────────────────────────────────────────────── */
    #add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #task-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1a202c;
      outline: none;
      transition: border-color 0.2s;
    }

    #task-input:focus { border-color: #667eea; }
    #task-input::placeholder { color: #a0aec0; }

    #add-form button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-form button:hover { background: #5a67d8; }

    /* ── Todo list ────────────────────────────────────────────────────────── */
    #todo-list {
      list-style: none;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f7fafc;
    }

    #todo-list li:last-child { border-bottom: none; }

    #todo-list input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      color: #2d3748;
      word-break: break-word;
    }

    .done .todo-text {
      text-decoration: line-through;
      opacity: 0.45;
    }

    .delete-btn {
      padding: 4px 10px;
      background: transparent;
      color: #fc8181;
      border: 1px solid #fc8181;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .delete-btn:hover { background: #fc8181; color: white; }

    #empty-msg {
      text-align: center;
      color: #a0aec0;
      font-size: 0.9rem;
      padding: 24px 0;
      display: none;
    }

    /* ── Mobile ───────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .card { padding: 24px 16px; }
      h1 { font-size: 1.4rem; }
      #add-form { flex-direction: column; }
      #add-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Todo List</h1>
    <div id="counter">0 of 0 done</div>

    <div id="error-banner"></div>

    <form id="add-form">
      <input type="text" id="task-input" placeholder="What needs to be done?" maxlength="500" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
    <p id="empty-msg">No tasks yet — add one above!</p>
  </div>

  <script>
    const API = '/api/todos';

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      banner.textContent = msg;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 5000);
    }

    function updateCounter(todos) {
      const done = todos.filter(t => t.done).length;
      document.getElementById('counter').textContent = `${done} of ${todos.length} done`;
    }

    function renderTodos(todos) {
      const list = document.getElementById('todo-list');
      const emptyMsg = document.getElementById('empty-msg');
      list.innerHTML = '';

      if (todos.length === 0) {
        emptyMsg.style.display = 'block';
        updateCounter(todos);
        return;
      }

      emptyMsg.style.display = 'none';

      todos.forEach(todo => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
      });

      updateCounter(todos);
    }

    async function loadTodos() {
      try {
        const res = await fetch(API);
        const todos = await res.json();
        renderTodos(todos);
      } catch {
        showError('Network error — please try again.');
      }
    }

    async function addTodo(text) {
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (res.status === 400) {
          const data = await res.json();
          showError(data.error || 'Invalid input.');
          return;
        }
        await loadTodos();
      } catch {
        showError('Network error — please try again.');
      }
    }

    async function toggleTodo(id) {
      try {
        const res = await fetch(`${API}/${id}`, { method: 'PUT' });
        if (!res.ok) { await loadTodos(); return; }
        await loadTodos();
      } catch {
        showError('Network error — please try again.');
      }
    }

    async function deleteTodo(id) {
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (!res.ok) { await loadTodos(); return; }
        await loadTodos();
      } catch {
        showError('Network error — please try again.');
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) { showError('Task cannot be empty.'); return; }
      input.value = '';
      await addTodo(text);
    });

    document.addEventListener('DOMContentLoaded', loadTodos);
  </script>
</body>
</html>
